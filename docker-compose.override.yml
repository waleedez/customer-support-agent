# Layered on top of docker-compose.yml (which is regenerated by
# `langgraph_cli dockerfile --add-docker-compose` and should not be
# hand-edited - see README). `docker compose` merges this file in
# automatically; no -f flags needed.
#
# Adds a TLS-terminating reverse proxy in front of langgraph-api, because
# LangGraph Studio (https://smith.langchain.com) refuses to fetch plain HTTP
# resources from an HTTPS page (browser mixed-content blocking). See
# scripts/generate_self_signed_cert.sh to generate certs/server.{crt,key}
# before starting this service - it will fail to start without them.
services:
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - langgraph-api
